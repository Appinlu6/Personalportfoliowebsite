<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="figure.css" />
    <style>
      .canvas { width: 1200px; height: 460px; }
      .t { position: absolute; text-align: center; }
      .t .title { font-size: 17px; }
      .d { position: absolute; top: 392px; text-align: center; font-size: 14px; color: #b8b09f; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <svg class="wires" width="1200" height="460">
        <defs>
          <pattern id="win" x="83" y="150" width="22" height="26" patternUnits="userSpaceOnUse">
            <rect x="6" y="7" width="10" height="12" rx="1.5" fill="rgba(210,169,52,0.35)" />
          </pattern>
          <pattern id="win2" x="395" y="220" width="20" height="24" patternUnits="userSpaceOnUse">
            <rect x="6" y="7" width="8" height="10" rx="1.5" fill="rgba(243,239,229,0.14)" />
          </pattern>
        </defs>

        <path d="M40 360 H1160" stroke="rgba(243,239,229,0.3)" stroke-width="1.5" />

        <rect x="70" y="140" width="180" height="220" rx="4" fill="#24211b" stroke="#d2a934" stroke-width="1.5" />
        <rect x="83" y="150" width="154" height="208" fill="url(#win)" />

        <rect x="390" y="210" width="150" height="150" rx="4" fill="#24211b" stroke="rgba(243,239,229,0.3)" stroke-width="1.5" />
        <rect x="395" y="220" width="140" height="120" fill="url(#win2)" />

        <g fill="#24211b" stroke="rgba(243,239,229,0.3)" stroke-width="1.5">
          <path d="M610 360 V300 L645 276 L680 300 V360" />
          <path d="M720 360 V310 L750 290 L780 310 V360" />
          <path d="M800 360 V318 L826 300 L852 318 V360" />

          <path d="M700 336 V360" />
          <circle cx="792" cy="326" r="14" />
          <path d="M792 340 V360" />
        </g>

        <path
          d="M920 360 V300 H950 V262 H980 V286 H1010 V232 H1036 V250 H1062 V214 H1090 V270 H1118 V292 H1150 V360"
          fill="none"
          stroke="rgba(243,239,229,0.3)"
          stroke-width="1.5"
          stroke-dasharray="5 5"
        />

        <circle cx="236" cy="224" r="6" fill="#d2a934" />
        <path d="M244 222 L1150 196" stroke="#d2a934" stroke-width="1.5" stroke-dasharray="4 6" />

        <g stroke="rgba(243,239,229,0.3)" stroke-width="1.5">
          <path d="M390 372 V384 M540 372 V384 M390 378 H540" />
          <path d="M600 372 V384 M860 372 V384 M600 378 H860" />
          <path d="M920 372 V384 M920 378 H1150" />
        </g>
      </svg>

      <div class="t" style="left:40px; top:96px; width:240px"><div class="title">School</div></div>
      <div class="note" style="position:absolute; left:262px; top:232px">Player at a window</div>

      <div class="t" style="left:345px; top:166px; width:240px"><div class="title">Neighbouring school</div></div>
      <div class="t" style="left:600px; top:236px; width:260px"><div class="title">Housing and trees</div></div>
      <div class="t" style="left:900px; top:166px; width:270px"><div class="title">Painted skyline cards</div></div>

      <div class="d" style="left:390px; width:150px">within 15 m</div>
      <div class="d" style="left:600px; width:260px">up to 30 m</div>
      <div class="d" style="left:920px; width:230px">beyond</div>
    </div>
  </body>
</html>
